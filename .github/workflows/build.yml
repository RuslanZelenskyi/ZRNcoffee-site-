
name: Build site from catalog.json

# Запускається, коли змінюється catalog.json або сам збирач. Після збирання комітить оновлені
# index.html, сторінки сортів/блогу, pages.css і sitemap.xml.
on:
  push:
    paths:
      - 'catalog.json'
      - 'tools/build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: python tools/build.py
      - name: Commit generated files
        run: |
          git config user.name "zrn-build"
          git config user.email "zrn-build@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Build site from catalog.json [skip ci]"
            git push
          fi
